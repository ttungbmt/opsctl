# Built-in defaults for ops. Override in ~/.config/ops/config.yaml (or $OPS_CONFIG).
#
# Ordering: top-level sections go in dependency order -- each one refers only to
# something defined above it, so `mise` (the preflight prerequisite) comes first and
# `profile` (which names tools and packages) comes last. Inside a section entries are
# alphabetical, and an entry's keys follow its schema in src/core/config.ts. The one
# exception is `profile`, which follows its `extends` chain instead: a profile reads as
# an extension of the one above it, and test/core/config.test.ts pins that order.

# Where ops gets mise when a machine has none. It cannot use `mise bootstrap packages`
# for this -- that is the loop itself. ops downloads this script and runs it as argv
# rather than piping it into a shell: the same trust, but a truncated download cannot
# half-execute, which `curl | sh` permits. The script verifies sha256 checksums and
# detects OS, architecture and libc itself.
mise:
  installer: https://mise.run
  # /usr/local/bin is on every default PATH, so the rest of the run and every later
  # shell find mise immediately. ~/.local/bin is only on PATH after a login that saw
  # the directory already exist.
  path: /usr/local/bin/mise

package:
  # Plain names installed with apt/dnf even when the mise registry has them:
  # shells and base system packages that other software expects at system paths.
  # User config: `system: [...]` replaces this list, `system: {add: [...], remove: [...]}` adjusts it.
  system:
    - bash
    - build-essential
    - ca-certificates
    - curl
    - fish
    - git
    - openssh-client
    - tmux
    - unzip
    - wget
    - zsh

# Third-party apt repositories a recipe can reference by name. For repo.<name> ops writes
# /etc/apt/keyrings/ops-<name>.asc, /etc/apt/sources.list.d/ops-<name>.sources and
# /etc/apt/preferences.d/ops-<name>.pref, runs `apt-get update`, then checks that apt's
# candidate really comes from the repo before anything is installed.
repo:
  mozilla:
    uri: https://packages.mozilla.org/apt
    suite: mozilla
    components: [main]
    keyring: https://packages.mozilla.org/apt/repo-signing-key.gpg
    # This repo publishes an internal path as its Release `Origin:`, so the pin matches the
    # site hostname instead. Do not "correct" this to `release o=` -- that breaks the pin.
    # 1000 beats the Ubuntu archive's 500, whose `firefox` is a 121 KB transitional package
    # that installs the Firefox snap.
    pin:
      origin: packages.mozilla.org
      priority: 1000

# Named tool recipes. A plain name resolves to `package` before any heuristic
# (system list, mise registry), so `ops tool install google-chrome` knows the real
# package name. `prepare` runs only when the tool is missing: it makes the
# package installable on a machine that has never seen it. `setup` configures a
# tool once it exists; each step's `check` decides whether `run` is needed and
# verifies it afterwards, so a check must fail only for what its `run` repairs.
# `uninstall.purge.paths` names what `ops tool uninstall --purge` deletes after
# the package is gone: only what the package manager does not own itself. Paths
# are absolute or `~/`-rooted, validated at load, and never expanded as globs.
tool:
  agent-browser:
    summary: Browser automation CLI for AI agents
    # Already in the mise registry (aqua:vercel-labs/agent-browser); the recipe
    # exists to carry `setup`, and pins resolution so no registry lookup runs.
    package: mise:agent-browser
    setup:
      # The binary alone cannot drive anything: `install` downloads Chrome for
      # Testing and, with --with-deps, the system libraries it needs. `doctor`
      # exits 1 when any check fails; --quick skips its live headless launch and
      # --offline skips network probes, keeping the probe fast and local.
      - name: browser binaries
        check: [agent-browser, doctor, --quick, --offline]
        run: [agent-browser, install, --with-deps]

  firefox:
    summary: Mozilla Firefox
    # Mozilla publishes no standalone .deb, so there is nothing to `prepare`; the repo is what
    # makes `apt:firefox` mean Mozilla's build rather than Ubuntu's snap shim.
    package: apt:firefox
    repo: mozilla

  google-chrome:
    summary: Google Chrome
    package: apt:google-chrome-stable
    prepare:
      # Google's own .deb; its postinst configures the apt repo for later updates.
      deb: https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
    uninstall:
      # `--purge` only, and only what dpkg does not own. Verified with `dpkg -S`
      # against a real install: /opt/google/chrome and the
      # /etc/cron.daily/google-chrome symlink belong to the package and go with
      # `apt-get purge`, while the two repo files below belong to nobody --
      # Chrome's postinst writes them ("This file will not be recreated if
      # removed") and they would re-add the repo on the next `apt update`.
      # `.sources` is the deb822 name current Chrome writes and `.list` the
      # older one; the keyring moved between releases. A path that does not
      # exist is a no-op, so every known variant is listed.
      purge:
        paths:
          - /etc/apt/sources.list.d/google-chrome.sources
          - /etc/apt/sources.list.d/google-chrome.list
          - /usr/share/keyrings/google-chrome.gpg
          - /etc/apt/keyrings/google-chrome.gpg
          - ~/.config/google-chrome
          - ~/.cache/google-chrome

# Named machine profiles. `ops bootstrap <name>` converges the machine to one, and
# `ops bootstrap` with no name runs `minimal`. `extends` composes: list sections are
# concatenated base-first and deduplicated, so a profile states what it adds rather
# than restating its base. A user profile of the same name replaces the built-in
# wholesale -- build on one with `extends` instead of retyping it. `packages` resolves
# the way `ops tool install` does; `tools` ignores package.system, so a bare name there
# prefers the mise registry and may carry @version.
#
# Ordered by the `extends` chain rather than alphabetically: each profile reads as an
# extension of the one above it.
profile:
  base:
    summary: What ops itself needs on any machine
    packages: [ca-certificates, curl, git, unzip]

  minimal:
    summary: A machine you can work on over ssh
    extends: base
    packages: [build-essential, openssh-client, tmux, wget]

  dev:
    summary: Local development box
    extends: minimal
    # No `setup:` here on purpose: the only recipe with setup steps is agent-browser,
    # and a default profile must not download a browser.
    packages: [zsh]
    # Pinned to the LTS line; pnpm tracks latest. A bare name records @latest.
    tools: [node@lts, pnpm]
